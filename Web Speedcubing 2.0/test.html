<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartičky - Flexbox</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: white;
            width: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
        }

        .card-content p {
            font-size: 14px;
            color: #555;
        }

        .card button {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .card button:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

<header>
    <h1>Moje úvodní stránka</h1>
    <p>Kartičky pomocí Flexboxu</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://picsum.photos/300/200?1" alt="obrazek">
        <div class="card-content">
            <h3>Kartička 1</h3>
            <p>Toto je první kartička s krátkým popisem.</p>
            <button>Více</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2" alt="obrazek">
        <div class="card-content">
            <h3>Kartička 2</h3>
            <p>Druhá kartička s nějakým textem.</p>
            <button>Více</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3" alt="obrazek">
        <div class="card-content">
            <h3>Kartička 3</h3>
            <p>Třetí kartička ve flexbox layoutu.</p>
            <button>Více</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?4" alt="obrazek">
        <div class="card-content">
            <h3>Kartička 4</h3>
            <p>Další příklad kartičky.</p>
            <button>Více</button>
        </div>
    </div>

</div>

</body>
</html>
